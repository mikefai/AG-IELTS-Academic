<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YDT Diagnostic Mock Exam | 40 Soruluk Tanılama Sınavı</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --success: #16a34a;
      --success-light: #dcfce7;
      --danger: #dc2626;
      --danger-light: #fee2e2;
      --warning: #d97706;
      --warning-light: #fef3c7;
      --border: #e2e8f0;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
      --radius: 12px;
      --font: 'Plus Jakarta Sans', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    [data-theme="dark"] {
      --bg: #0b0f19;
      --surface: #131b2e;
      --card-bg: #1e293b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #60a5fa;
      --primary-hover: #3b82f6;
      --primary-light: #1e293b;
      --border: #334155;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow);
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      background: linear-gradient(135deg, #2563eb, #8b5cf6);
      color: white;
      font-weight: 800;
      padding: 6px 12px;
      border-radius: 8px;
    }

    .brand-title {
      font-weight: 700;
      font-size: 1.1rem;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .timer-box {
      font-family: var(--font-mono);
      font-size: 1.1rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 8px;
      background: var(--primary-light);
      color: var(--primary);
    }

    .btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .btn:hover {
      background: var(--primary-light);
      border-color: var(--primary);
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .main-container {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .sidebar {
      width: 280px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 1.25rem;
      overflow-y: auto;
    }

    .sidebar-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 1rem;
      letter-spacing: 0.5px;
    }

    .grid-navigator {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 1.5rem;
    }

    .nav-btn {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .nav-btn.active {
      border-color: var(--primary);
      background: var(--primary-light);
      color: var(--primary);
    }

    .nav-btn.answered {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .nav-btn.flagged {
      border-color: var(--warning);
      background: var(--warning-light);
      color: var(--warning);
    }

    .workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      overflow: hidden;
    }

    .content-area {
      flex: 1;
      padding: 2rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .split-pane {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 100%;
      height: 100%;
      gap: 1.5rem;
    }

    .pane-left {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      overflow-y: auto;
      box-shadow: var(--shadow);
    }

    .pane-right {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      overflow-y: auto;
    }

    .question-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      width: 100%;
      max-width: 720px;
      box-shadow: var(--shadow);
    }

    .question-section {
      font-size: 0.8rem;
      text-transform: uppercase;
      color: var(--primary);
      font-weight: 800;
      margin-bottom: 0.5rem;
      letter-spacing: 1px;
    }

    .question-stem {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      white-space: pre-line;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 1.5rem;
    }

    .option-card {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }

    .option-card:hover {
      background: var(--bg);
      border-color: var(--primary);
    }

    .option-card.selected {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
      font-weight: 600;
    }

    .option-letter {
      font-family: var(--font-mono);
      font-weight: 700;
      margin-right: 12px;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 2px solid currentColor;
    }

    .workspace-footer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .flag-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--warning);
      border-color: var(--warning);
    }

    .flag-btn.active {
      background: var(--warning-light);
    }

    /* Explanation Section */
    .explanation-box {
      margin-top: 1rem;
      padding: 1.25rem;
      background: var(--bg);
      border-left: 4px solid var(--primary);
      border-radius: 4px;
      display: none;
    }

    .explanation-box.visible {
      display: block;
    }

    /* Results Screen */
    .results-screen {
      padding: 2rem;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      overflow-y: auto;
      height: 100%;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .summary-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .summary-num {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--primary);
    }

    .review-list {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .review-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow);
    }

    .review-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
    }

    .status-badge {
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
    }

    .status-correct { background: var(--success-light); color: var(--success); }
    .status-wrong { background: var(--danger-light); color: var(--danger); }
    .status-empty { background: var(--border); color: var(--text-muted); }

    .accordion-toggle {
      background: var(--primary-light);
      color: var(--primary);
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      margin-top: 1rem;
    }

    .text-pane-title {
      font-weight: 800;
      margin-bottom: 1rem;
      border-bottom: 2px solid var(--primary);
      padding-bottom: 4px;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon">YDT</div>
      <div class="brand-title">YDT İngilizce Tanılama Sınavı</div>
    </div>
    <div class="header-controls">
      <button class="btn" onclick="toggleTheme()">🌓 Tema</button>
      <div class="timer-box" id="timer">60:00</div>
      <button class="btn btn-primary" onclick="submitExam()">Sınavı Bitir</button>
    </div>
  </header>

  <div class="main-container">
    <div class="sidebar" id="sidebarContainer">
      <div class="sidebar-title">Soru Gezgini</div>
      <div class="grid-navigator" id="navigatorGrid"></div>
      <div style="margin-top: auto;">
        <button class="btn btn-primary" style="width: 100%;" onclick="submitExam()">Sınavı Tamamla</button>
      </div>
    </div>

    <div class="workspace">
      <div class="content-area" id="workspaceContent">
        <!-- Question content loaded here dynamically -->
      </div>

      <div class="workspace-footer" id="workspaceFooter">
        <button class="btn flag-btn" id="flagBtn" onclick="toggleFlag()"><span id="flagIcon">🏳️</span> İşaretle</button>
        <div style="display: flex; gap: 12px;">
          <button class="btn" onclick="prevQuestion()">Geri</button>
          <button class="btn btn-primary" onclick="nextQuestion()">İleri</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const questions = [
  {
    "number": 1,
    "section": "Vocabulary",
    "stem": "The local government decided to implement strict ---- to protect the historical city center from the negative impacts of rapid industrialization.",
    "options": [
      {
        "letter": "A",
        "text": "constraints"
      },
      {
        "letter": "B",
        "text": "measures"
      },
      {
        "letter": "C",
        "text": "compliments"
      },
      {
        "letter": "D",
        "text": "deviations"
      },
      {
        "letter": "E",
        "text": "incentives"
      }
    ],
    "correct": "B",
    "explanation": "**Doğru Cevap: B**\n\n**Kelime Analizi:**\n- **measures (önlemler):** \"take/implement measures\" (önlem almak/uygulamak) YDT ve ÖSYM sınavlarında son derece yaygın bir ifadedir. Cümle, yerel yönetimin tarihi şehir merkezini hızlı sanayileşmenin olumsuz etkilerinden korumak için sıkı önlemler uygulamaya karar verdiğini belirtmektedir.\n- **constraints (kısıtlamalar/engeller):** Anlamca olumlu bir koruma tedbirini ifade etmek için doğrudan \"önlem\" kelimesi kadar uygun değildir.\n- **compliments (iltifatlar/övgüler):** Bağlam dışıdır.\n- **deviations (sapmalar):** Cümle akışına uymaz.\n- **incentives (teşvikler):** Koruma ve sanayileşmeyi engelleme amacıyla \"sıkı teşvikler uygulamak\" çelişkilidir."
  },
  {
    "number": 2,
    "section": "Vocabulary",
    "stem": "The impact of the global chip shortage on the automotive industry was ----, leading to massive production cuts and delays worldwide.",
    "options": [
      {
        "letter": "A",
        "text": "indifferent"
      },
      {
        "letter": "B",
        "text": "unprecedented"
      },
      {
        "letter": "C",
        "text": "negligible"
      },
      {
        "letter": "D",
        "text": "superficial"
      },
      {
        "letter": "E",
        "text": "reluctant"
      }
    ],
    "correct": "B",
    "explanation": "**Doğru Cevap: B**\n\n**Kelime Analizi:**\n- **unprecedented (eşi benzeri görülmemiş):** Küresel çip krizinin otomotiv endüstrisi üzerindeki büyük etkisini (massive production cuts) nitelemek için en uygun sıfattır.\n- **indifferent (kayıtsız/ilgisiz):** İnsanlar için kullanılır, cansız etkiler için uygun değildir.\n- **negligible (ihmal edilebilir/önemsiz):** \"Massive production cuts\" ifadesiyle doğrudan çelişir.\n- **superficial (yüzeysel):** Etkinin derin ve geniş çaplı olmasıyla uyumsuzdur.\n- **reluctant (gönülsüz/isteğiz):** İnsanlar veya kararlar için kullanılır."
  },
  {
    "number": 3,
    "section": "Vocabulary",
    "stem": "Psychologists suggest that individuals who fail to ---- stress in their daily lives are more prone to developing chronic anxiety and physical fatigue.",
    "options": [
      {
        "letter": "A",
        "text": "put off"
      },
      {
        "letter": "B",
        "text": "cope with"
      },
      {
        "letter": "C",
        "text": "bring about"
      },
      {
        "letter": "D",
        "text": "make up for"
      },
      {
        "letter": "E",
        "text": "turn down"
      }
    ],
    "correct": "B",
    "explanation": "**Doğru Cevap: B**\n\n**Kelime Analizi:**\n- **cope with (başa çıkmak/mücadele etmek):** Stres ile başa çıkamayan bireylerin kronik anksiyete yaşamaya daha yatkın olduğu belirtilmektedir.\n- **put off (ertelemek):** Stresi ertelemek mantıklı bir kullanım değildir.\n- **bring about (sebep olmak/yol açmak):** Bireylerin strese sebep olamaması anlamı bozmaktadır.\n- **make up for (telafi etmek):** Stresi telafi etmek bağlama uymaz.\n- **turn down (reddetmek/sesini kısmak):** Stresi reddetmek anlamca karşılamaz."
  },
  {
    "number": 4,
    "section": "Grammar",
    "stem": "Until the telescope ---- in the early 17th century, astronomers ---- on simple observations made with the naked eye.",
    "options": [
      {
        "letter": "A",
        "text": "had been invented / relied"
      },
      {
        "letter": "B",
        "text": "was invented / had relied"
      },
      {
        "letter": "C",
        "text": "would be invented / relied"
      },
      {
        "letter": "D",
        "text": "was invented / have relied"
      },
      {
        "letter": "E",
        "text": "is invented / had been relying"
      }
    ],
    "correct": "B",
    "explanation": "**Doğru Cevap: B**\n\n**Dilbilgisi Analizi:**\n- Cümlede tarihsel bir geçmişten (\"in the early 17th century\") bahsedilmektedir. Bu nedenle her iki boşluk da geçmiş zaman olmalıdır.\n- Teleskobun icat edilmesi (\"was invented\" - Simple Past Passive) geçmişteki bir noktadır. Astronomların çıplak gözle yapılan gözlemlere dayanması ise bu icattan önce süregelen daha eski bir eylemi temsil eder. Dolayısıyla bu eylem Past Perfect (\"had relied\") ile çekimlenmelidir.\n- **Çeldirici Analizi:** A seçeneğinde zaman ilişkisi ters verilmiştir; teleskobun icadı gözlemlerden sonra gerçekleştiği için icadın Past Perfect olması dilbilgisi kurallarına aykırıdır."
  },
  {
    "number": 5,
    "section": "Grammar",
    "stem": "---- for its rich biodiversity and ancient geothermal vents, the Galapagos Islands continue to attract scientists from all over the world.",
    "options": [
      {
        "letter": "A",
        "text": "Having known"
      },
      {
        "letter": "B",
        "text": "To be known"
      },
      {
        "letter": "C",
        "text": "Known"
      },
      {
        "letter": "D",
        "text": "Knowing"
      },
      {
        "letter": "E",
        "text": "To know"
      }
    ],
    "correct": "C",
    "explanation": "**Doğru Cevap: C**\n\n**Dilbilgisi Analizi (Participle Reduction):**\n- Galapagos Adaları kendi kendini bilmez, başkaları tarafından \"bilinir\" (passive/edilgen). Bu yüzden cümlede edilgen bir kısaltma (V3) aranmalıdır.\n- \"Known for...\" (ile bilinen) yapısı, \"Which are known for...\" sıfat cümleciğinin edilgen kısaltmasıdır.\n- **Çeldirici Analizi:** A seçeneği (Having known) ve D seçeneği (Knowing) etkendir. B seçeneği (To be known) ise amaç bildirir ve cümlenin başına bu şekilde gelmez."
  },
  {
    "number": 6,
    "section": "Grammar",
    "stem": "Renewable energy sources are key to reducing our dependence ---- fossil fuels, which are primarily responsible ---- rising global temperatures.",
    "options": [
      {
        "letter": "A",
        "text": "on / for"
      },
      {
        "letter": "B",
        "text": "of / to"
      },
      {
        "letter": "C",
        "text": "in / about"
      },
      {
        "letter": "D",
        "text": "with / in"
      },
      {
        "letter": "E",
        "text": "from / by"
      }
    ],
    "correct": "A",
    "explanation": "**Doğru Cevap: A**\n\n**Preposition (Edat) Analizi:**\n- **dependence on (bir şeye bağımlılık):** \"Depend\", \"dependent\" ve \"dependence\" sözcükleri \"on\" edatı ile kullanılır.\n- **responsible for (bir şeyden sorumlu olmak):** \"Responsible\" sıfatı ise \"for\" edatını alır.\n- Bu iki kalıplaşan yapıyı eşleştiren tek seçenek A'dır."
  },
  {
    "number": 7,
    "section": "Grammar",
    "stem": "---- some species of bacteria are harmful and cause serious diseases, the vast majority are beneficial and play an essential role in human digestion.",
    "options": [
      {
        "letter": "A",
        "text": "Because"
      },
      {
        "letter": "B",
        "text": "Although"
      },
      {
        "letter": "C",
        "text": "Unless"
      },
      {
        "letter": "D",
        "text": "In case"
      },
      {
        "letter": "E",
        "text": "As long as"
      }
    ],
    "correct": "B",
    "explanation": "**Doğru Cevap: B**\n\n**Bağlaç Analizi:**\n- İki cümle arasında açık bir zıtlık vardır: \"some species are harmful\" (bazı türler zararlıdır) ve \"the vast majority are beneficial\" (büyük çoğunluğu yararlıdır).\n- Bu zıtlığı sağlayan tek bağlaç \"Although\" (-e rağmen) seçeneğidir.\n- **Çeldirici Analizi:** Because (çünkü) sebep bildirir. Unless (-medikçe) koşul bildirir ve olumsuzluk gerektirir. In case (durumunda/olur diye) tedbir bildirir."
  },
  {
    "number": 8,
    "section": "Grammar",
    "stem": "According to the new environmental regulations, factories must ---- upgrade their waste filtration systems ---- face severe financial penalties.",
    "options": [
      {
        "letter": "A",
        "text": "neither / nor"
      },
      {
        "letter": "B",
        "text": "either / or"
      },
      {
        "letter": "C",
        "text": "not only / but also"
      },
      {
        "letter": "D",
        "text": "so / that"
      },
      {
        "letter": "E",
        "text": "both / and"
      }
    ],
    "correct": "B",
    "explanation": "**Doğru Cevap: B**\n\n**İkili Bağlaç Analizi:**\n- Cümlede fabrikalara iki seçenek sunulmaktadır: \"ya filtre sistemlerini yükseltmek\" ya da \"ağır para cezaları ile karşılaşmak\".\n- Seçenek sunan ikili yapı \"either ... or ...\" (ya ... ya da ...) yapısıdır.\n- **Çeldirici Analizi:** \"not only ... but also ...\" (sadece ... değil aynı zamanda ...) fabrikaların hem yükseltme yapıp hem de ceza alacağını söyleyeceği için anlamsız olur."
  },
  {
    "number": 9,
    "section": "Cloze Test",
    "stem": "*(Cloze Test Soru 9-13)*\n\nThe Rosetta Stone, discovered in 1799, was the key to understanding Egyptian hieroglyphs. Before its discovery, scholars **(9) ----** unable to decipher the ancient writings because the language had been lost for centuries. The stone features a decree written in three **(10) ----** scripts: Hieroglyphic, Demotic, and Ancient Greek. **(11) ----** studying the Greek text, researchers were able to link the Greek words to the hieroglyphic symbols. This breakthrough occurred **(12) ----** the dedication of Jean-François Champollion, who spent years **(13) ----** on the stone.\n\n**Soru 9:**",
    "options": [
      {
        "letter": "A",
        "text": "are"
      },
      {
        "letter": "B",
        "text": "were"
      },
      {
        "letter": "C",
        "text": "have been"
      },
      {
        "letter": "D",
        "text": "would be"
      },
      {
        "letter": "E",
        "text": "will have been"
      }

    "explanation": "**Doğru Cevap: D**\n\n**Akışı Bozan Cümle Analizi:**\n- Paragraf matbaanın icadını, elle kitap yazımından seri üretime geçişini ve bunun tarihsel etkilerini (Rönesans, okuryazarlık) anlatmaktadır.\n- I, II, III ve V numaralı cümleler tarihsel matbaa ve sonuçları üzerinedir. IV numaralı cümle ise konuyu aniden günümüz e-kitap okuyucularına getirerek tarihsel akışı kesmektedir."
  }
];

    let currentIndex = 0;
    let answers = {};
    let flagged = new Set();
    let isSubmitted = false;
    let timerInterval = null;
    let timeRemaining = 3600; // 60 minutes

    function init() {
      renderNavigator();
      loadQuestion();
      startTimer();
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        timeRemaining--;
        if (timeRemaining <= 0) {
          clearInterval(timerInterval);
          submitExam();
        }
        const mins = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
        const secs = (timeRemaining % 60).toString().padStart(2, '0');
        document.getElementById('timer').innerText = `${mins}:${secs}`;
      }, 1000);
    }

    function renderNavigator() {
      const grid = document.getElementById('navigatorGrid');
      grid.innerHTML = '';
      questions.forEach((q, idx) => {
        const btn = document.createElement('button');
        btn.className = 'nav-btn';
        btn.innerText = q.number;
        btn.onclick = () => jumpToQuestion(idx);

        if (idx === currentIndex) btn.classList.add('active');
        if (answers[q.number]) btn.classList.add('answered');
        if (flagged.has(q.number)) btn.classList.add('flagged');

        grid.appendChild(btn);
      });
    }

    function loadQuestion() {
      if (isSubmitted) return;
      const q = questions[currentIndex];
      const workspace = document.getElementById('workspaceContent');
      
      const hasPassage = q.stem.includes("Reading Passage 1:") || q.stem.includes("Reading Passage 2:") || q.stem.includes("Cloze Test Soru");
      
      if (hasPassage) {
        // Split view
        workspace.style.width = "100%";
        workspace.style.height = "100%";
        
        let textContent = "";
        if (q.stem.includes("Reading Passage 1:")) {
          textContent = `
            <div class="text-pane-title">Reading Passage 1</div>
            <p><strong>The Great Barrier Reef</strong>, stretching over 2,300 kilometers off the coast of Australia, is the world's largest coral reef system. It is home to thousands of marine species, making it a critical component of global marine biodiversity. However, in recent decades, the reef has faced severe threats from ocean warming caused by climate change. When water temperatures rise even slightly, corals undergo a process known as bleaching. During bleaching, corals expel the colorful algae living in their tissues, which turns them white and deprives them of their primary energy source. Without these algae, corals eventually starve and die. Scientists warn that if global emissions are not drastically reduced, recurrent mass bleaching events could lead to the permanent loss of this ecological wonder. While conservation efforts are underway, including artificial breeding of heat-resistant corals, local measures alone cannot save the reef without a global commitment to reduce greenhouse gases.</p>
          `;
        } else if (q.stem.includes("Reading Passage 2:")) {
          textContent = `
            <div class="text-pane-title">Reading Passage 2</div>
            <p><strong>The Indus Valley Civilization</strong>, which flourished around 2500 BCE in what is now Pakistan and northwest India, was one of the three great early civilizations of the Old World, alongside Egypt and Mesopotamia. Unlike their contemporaries, who built massive temples and monuments dedicated to kings and gods, the people of the Indus Valley prioritized urban planning, sanitation, and utility. Cities like Harappa and Mohenjo-daro featured grid-like street layouts, sophisticated drainage systems, and large public baths. Their houses were built with standardized baked bricks and had private wells and bathrooms. This emphasis on hygiene and egalitarianism suggests a highly organized society with a strong municipal authority, though no evidence of a centralized monarchy or military ruling class has been found. The civilization's script remains undeciphered, leaving many aspects of their social structure and religious beliefs a mystery. Around 1900 BCE, the civilization began to decline, possibly due to climate shifts that altered the path of the Indus River, leading to agricultural failure.</p>
          `;
        } else {
          textContent = `
            <div class="text-pane-title">Cloze Test Passage</div>
            <p>The Rosetta Stone, discovered in 1799, was the key to understanding Egyptian hieroglyphs. Before its discovery, scholars <strong>(9) ----</strong> unable to decipher the ancient writings because the language had been lost for centuries. The stone features a decree written in three <strong>(10) ----</strong> scripts: Hieroglyphic, Demotic, and Ancient Greek. <strong>(11) ----</strong> studying the Greek text, researchers were able to link the Greek words to the hieroglyphic symbols. This breakthrough occurred <strong>(12) ----</strong> the dedication of Jean-François Champollion, who spent years <strong>(13) ----</strong> on the stone.</p>
          `;
        }

        // Clean up stem from header
        let displayStem = q.stem;
        displayStem = displayStem.replace(/\*\(Reading Passage \d: Soru \d+-\d+\)\*/g, "");
        displayStem = displayStem.replace(/\*\(Cloze Test Soru \d+-\d+\)\*/g, "");
        displayStem = displayStem.replace(/Reading Passage \d:/g, "");
        displayStem = displayStem.replace(/Cloze Test Soru/g, "");

        workspace.innerHTML = `
          <div class="split-pane">
            <div class="pane-left">${textContent}</div>
            <div class="pane-right">
              <div class="question-card" style="width:100%; box-shadow:none; border:none; padding:1rem;">
                <div class="question-section">${q.section} | Soru ${q.number}</div>
                <div class="question-stem">${displayStem}</div>
                <div class="options-list">
                  ${q.options.map(opt => `
                    <div class="option-card ${answers[q.number] === opt.letter ? 'selected' : ''}" onclick="selectOption('${opt.letter}')">
                      <span class="option-letter">${opt.letter}</span>
                      <span>${opt.text}</span>
                    </div>
                  `).join('')}
                </div>
              </div>
            </div>
          </div>
        `;
      } else {
        // Standard view
        workspace.style.width = "auto";
        workspace.style.height = "auto";
        workspace.innerHTML = `
          <div class="question-card">
            <div class="question-section">${q.section} | Soru ${q.number}</div>
            <div class="question-stem">${q.stem}</div>
            <div class="options-list">
              ${q.options.map(opt => `
                <div class="option-card ${answers[q.number] === opt.letter ? 'selected' : ''}" onclick="selectOption('${opt.letter}')">
                  <span class="option-letter">${opt.letter}</span>
                  <span>${opt.text}</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      // Update flag button state
      const flagBtn = document.getElementById('flagBtn');
      if (flagged.has(q.number)) {
        flagBtn.classList.add('active');
        document.getElementById('flagIcon').innerText = '🚩';
      } else {
        flagBtn.classList.remove('active');
        document.getElementById('flagIcon').innerText = '🏳️';
      }

      renderNavigator();
    }

    function selectOption(letter) {
      const q = questions[currentIndex];
      if (answers[q.number] === letter) {
        delete answers[q.number]; // Toggle off
      } else {
        answers[q.number] = letter;
      }
      loadQuestion();
    }

    function toggleFlag() {
      const q = questions[currentIndex];
      if (flagged.has(q.number)) {
        flagged.delete(q.number);
      } else {
        flagged.add(q.number);
      }
      loadQuestion();
    }

    function prevQuestion() {
      if (currentIndex > 0) {
        currentIndex--;
        loadQuestion();
      }
    }

    function nextQuestion() {
      if (currentIndex < questions.length - 1) {
        currentIndex++;
        loadQuestion();
      }
    }

    function jumpToQuestion(idx) {
      currentIndex = idx;
      loadQuestion();
    }

    function submitExam() {
      if (isSubmitted) return;
      if (!confirm("Sınavı bitirmek istediğinizden emin misiniz? Cevaplarınız kaydedilecek ve analiz ekranı açılacaktır.")) return;
      
      clearInterval(timerInterval);
      isSubmitted = true;

      let correctCount = 0;
      let wrongCount = 0;
      let emptyCount = 0;

      questions.forEach(q => {
        const userAns = answers[q.number];
        if (!userAns) {
          emptyCount++;
        } else if (userAns === q.correct) {
          correctCount++;
        } else {
          wrongCount++;
        }
      });

      const netScore = (correctCount - (wrongCount * 0.25)).toFixed(2);

      // Hide workspace/sidebar layout and show results
      const mainContainer = document.querySelector('.main-container');
      mainContainer.innerHTML = `
        <div class="results-screen">
          <h2 style="margin-bottom:1.5rem; text-align:center;">Sınav Sonuçları ve Analizi</h2>
          
          <div class="summary-grid">
            <div class="summary-card">
              <div class="summary-num" style="color:var(--success);">${correctCount}</div>
              <div style="font-weight:700;">Doğru</div>
            </div>
            <div class="summary-card">
              <div class="summary-num" style="color:var(--danger);">${wrongCount}</div>
              <div style="font-weight:700;">Yanlış</div>
            </div>
            <div class="summary-card">
              <div class="summary-num" style="color:var(--text-muted);">${emptyCount}</div>
              <div style="font-weight:700;">Boş</div>
            </div>
            <div class="summary-card">
              <div class="summary-num" style="color:var(--primary);">${netScore}</div>
              <div style="font-weight:700;">Net Skoru</div>
            </div>
          </div>

          <div style="background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:1.5rem; margin-bottom:2rem; box-shadow:var(--shadow);">
            <h3 style="margin-bottom:0.75rem; color:var(--primary);">Kişiselleştirilmiş Öğrenci Profili Analizi</h3>
            <p>2 ay önce girdiğiniz sınavda <strong>57 Doğru, 22 Yanlış (51.5 Net)</strong> yapmıştınız. Bu testteki performansınızla o zamandan bu yana kaydettiğiniz ilerlemeyi kıyaslayabilirsiniz.</p>
            <p style="margin-top:0.75rem;">YDT Net hesaplamasında 4 yanlış 1 doğruyu götürmektedir. Özellikle bağlaç yapıları, cümle tamamlama ve restatement sorularında çeldirici analizlerini dikkatle okumanız önerilir.</p>
          </div>

          <h3 style="margin-bottom:1rem;">Detaylı Soru İncelemesi</h3>
          <div class="review-list">
            ${questions.map((q, idx) => {
              const userAns = answers[q.number] || "Boş";
              const isCorrect = userAns === q.correct;
              const statusClass = userAns === "Boş" ? "status-empty" : (isCorrect ? "status-correct" : "status-wrong");
              const statusText = userAns === "Boş" ? "Boş" : (isCorrect ? "Doğru" : "Yanlış");

              return `
                <div class="review-item">
                  <div class="review-header">
                    <span style="font-weight:800; color:var(--primary);">${q.section} | Soru ${q.number}</span>
                    <span class="status-badge ${statusClass}">${statusText}</span>
                  </div>
                  <div class="question-stem" style="font-size:1rem; margin-bottom:1rem;">${q.stem}</div>
                  <div class="options-list" style="margin-bottom:1rem; pointer-events:none;">
                    ${q.options.map(opt => {
                      let optClass = "";
                      if (opt.letter === q.correct) optClass = "selected"; // Show correct in green
                      return `
                        <div class="option-card ${optClass}" style="padding:8px 12px; font-size:0.9rem;">
                          <span class="option-letter" style="width:20px; height:20px; font-size:0.8rem;">${opt.letter}</span>
                          <span>${opt.text}</span>
                        </div>
                      `;
                    }).join('')}
                  </div>
                  <div style="font-size:0.9rem; color:var(--text-muted); margin-top:0.5rem;">
                    <strong>Sizin Cevabınız:</strong> ${userAns} | <strong>Doğru Cevap:</strong> ${q.correct}
                  </div>
                  
                  <button class="accordion-toggle" onclick="toggleExplanation(${q.number})">Çözüm ve Çeldirici Analizini Göster</button>
                  
                  <div class="explanation-box" id="explanation-${q.number}">
                    ${q.explanation.replace(/\n/g, '<br>')}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
      // Remove timer and finish button
      document.querySelector('.header-controls').innerHTML = `<span style="font-weight:700; color:var(--success);">Tamamlandı</span>`;
    }

    function toggleExplanation(qNum) {
      const box = document.getElementById("explanation-" + qNum);
      box.classList.toggle('visible');
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('ydt_theme', next);
    }

    const savedTheme = localStorage.getItem('ydt_theme');
    if (savedTheme) {
      document.documentElement.setAttribute('data-theme', savedTheme);
    }

    init();
  </script>
</body>
</html>
